name: Android APK (wird von macos-dmg.yml aufgerufen)

# Called by "Mac-App + Android-App" (macos-dmg.yml) before the DMG is built, so
# that the DMG carries exactly this APK. Can also be started by hand.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  apk:
    name: Tests + APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the build as "neueste" and on v* tags
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APK prüfen und benennen
        run: |
          set -euo pipefail
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FadisNemotron-$version.apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "dist/FadisNemotron-$version.apk"
          (cd dist && sha256sum ./*.apk > "FadisNemotron-$version.apk.sha256")
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: FadisNemotron-android-apk
          path: |
            android/dist/*.apk
            android/dist/*.sha256
          if-no-files-found: error

      - name: Als „Neueste Version“ veröffentlichen
        # Pushes, manual runs and pull requests from this repository (not forks, not tags).
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ../scripts/publish-latest.sh dist/FadisNemotron-*.apk FadisNemotron.apk

      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/dist/*.apk
            android/dist/*.sha256
