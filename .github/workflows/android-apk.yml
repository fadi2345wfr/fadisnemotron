name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Tests + APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to a release on v* tags
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APK prüfen und benennen
        run: |
          set -euo pipefail
          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FadisNemotron-$version.apk"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "dist/FadisNemotron-$version.apk"
          (cd dist && sha256sum ./*.apk > "FadisNemotron-$version.apk.sha256")
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: FadisNemotron-android-apk
          path: |
            android/dist/*.apk
            android/dist/*.sha256
          if-no-files-found: error

      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/dist/*.apk
            android/dist/*.sha256
