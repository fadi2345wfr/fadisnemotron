name: macOS DMG (Intel)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Tests + Intel-DMG
    # Apple Silicon runner; Rust cross-compiles to x86_64 with the same SDK.
    runs-on: macos-latest
    permissions:
      contents: write # publishes the build as "neueste" and on v* tags
    steps:
      - uses: actions/checkout@v7

      - name: Rust installieren
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add x86_64-apple-darwin
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Formatierung
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: App und DMG bauen
        run: ./scripts/build-dmg.sh

      - name: DMG prüfen
        run: |
          set -euo pipefail
          dmg="$(ls dist/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          ls -la "$mnt"
          app="$mnt/Fadis Nemotron.app"
          test -L "$mnt/Applications"
          test -f "$app/Contents/Resources/AppIcon.icns"
          plutil -p "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/fadis-nemotron"
          lipo -archs "$app/Contents/MacOS/fadis-nemotron" | grep -qx x86_64
          codesign --verify --strict "$app"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v7
        with:
          name: FadisNemotron-intel-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

      - name: Als „Neueste Version“ veröffentlichen
        # Pushes, manual runs and pull requests from this repository (not forks, not tags).
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/publish-latest.sh dist/FadisNemotron-*-intel.dmg FadisNemotron-Intel.dmg

      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
