[package]
name = "fadis-nemotron"
version = "0.8.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop-Agent und Chat für NVIDIA Nemotron 3.5 Super VL"
publish = false

[[bin]]
name = "fadis-nemotron"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
directories = "6"
eframe = { version = "0.37", features = ["glow"] }
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
egui_extras = { version = "0.37", features = ["image"] }
getrandom = "0.4"
globset = "0.4"
if-addrs = "0.15"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
qrcode = { version = "0.14", default-features = false }
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
ureq = { version = "3.5", features = ["platform-verifier"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Puts the Android app (the file named by FADIS_APK_PATH while building) into
# the program, so the Windows exe is one file that also serves the app to phones.
embed-apk = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Image decoding and scaling are very slow unoptimised; this keeps debug builds usable.
[profile.dev.package."*"]
opt-level = 2
